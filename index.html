<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MECHANICA — Skeleton Automatic</title>
<style>
:root{--g:#e6c07b;--t:#e8eef7;--m:#8d9aab;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--t);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 40%,#161b24 0%,#07090c 70%)}
#app{position:fixed;inset:0}
.p{position:fixed;z-index:5;background:rgba(10,12,16,.82);border:1px solid rgba(212,167,96,.3);border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.6)}

/* Side list (desktop) */
#side{left:14px;top:14px;bottom:76px;width:208px;overflow:auto;padding:8px}
.grp{font-size:10px;letter-spacing:.2em;color:#a08a5a;text-transform:uppercase;margin:12px 6px 4px}
.it{display:block;width:100%;text-align:left;background:none;border:0;color:#b9c4d2;font:inherit;font-size:12.5px;padding:6px 8px;border-radius:6px;cursor:pointer}
.it:hover{background:rgba(255,255,255,.07)}.it.on{background:rgba(212,167,96,.2);color:var(--g)}

/* Bottom control bar */
#bar{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
.b{background:linear-gradient(180deg,#2a2013,#1a140c);border:1px solid rgba(212,167,96,.45);color:var(--g);font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:8px 11px;border-radius:8px;cursor:pointer}
.b:hover{border-color:var(--g)}.b.on{background:var(--g);color:#1a140c}
.sep{width:1px;background:rgba(255,255,255,.12);margin:0 3px}

/* Info panel (desktop) */
#info{right:14px;top:14px;width:310px;padding:16px 18px;display:none}
#info h2{margin:2px 0 8px;font-size:17px;color:var(--g);font-weight:500}
#info .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--m)}
#info p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:#c3ceda}
#info .sp{font-size:12px;color:var(--g);border-top:1px solid rgba(255,255,255,.1);padding-top:9px}
#info .nav{display:flex;gap:6px;margin-top:12px}#info .nav .b{flex:1}
#info .x-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;padding:0;font-size:13px;line-height:1;display:none}
#info .handle{display:none;width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 10px}

#tip{position:fixed;pointer-events:none;z-index:9;padding:4px 9px;border-radius:6px;background:rgba(10,12,16,.92);border:1px solid rgba(212,167,96,.4);font-size:12px;color:var(--g);opacity:0;transition:opacity .1s}
#err{position:fixed;left:8px;bottom:8px;z-index:99;color:#f88;background:rgba(0,0,0,.85);padding:8px 10px;border:1px solid #f44;border-radius:6px;font:11px/1.4 ui-monospace,monospace;max-width:70vw;white-space:pre-wrap;display:none}

/* Backdrop for drawers/sheets on mobile */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:4;display:none;opacity:0;transition:opacity .18s}
#backdrop.on{display:block;opacity:1}

/* Mobile-only floating buttons */
#mobile-tools{display:none;position:fixed;z-index:6;right:10px;top:10px;gap:6px}
#mobile-tools .b{padding:10px 12px;font-size:12px;letter-spacing:.08em}

/* ---------- Mobile / small screens ---------- */
@media(max-width:820px),(max-width:900px) and (max-height:500px){
  #side{display:none}
  #hint{display:none}

  /* Info becomes a bottom sheet */
  #info{left:0;right:0;bottom:0;top:auto;width:100%;
    border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;
    max-height:52vh;overflow:auto;padding:14px 16px calc(14px + var(--safe-b));
    transform:translateY(110%);transition:transform .22s ease;display:block;visibility:hidden}
  #info.on{transform:translateY(0);visibility:visible}
  #info .handle{display:block}
  #info .x-btn{display:block}
  #info h2{font-size:16px;margin-right:28px}

  /* Control bar: single scrollable row */
  #bar{left:8px;right:8px;bottom:calc(8px + var(--safe-b));transform:none;
    flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;
    padding:6px;gap:5px;max-width:none;scrollbar-width:none}
  #bar::-webkit-scrollbar{display:none}
  #bar .sep{flex:0 0 1px}
  #bar .b{flex:0 0 auto;white-space:nowrap;padding:6px 7px;font-size:7.5px}

  #mobile-tools{display:flex}
  #mobile-tools .b{padding:7px 8px;font-size:8px}
}

/* Very small phones: shrink controls a touch more */
@media(max-width:420px){
  #bar .b{padding:5px 6px;font-size:7px}
  #mobile-tools .b{padding:6px 7px;font-size:7.5px}
  #info{max-height:56vh}
}

/* Energy-flow tour card */
#tour{left:50%;transform:translateX(-50%);bottom:74px;width:min(540px,calc(100% - 24px));padding:14px 18px;display:none;z-index:7}
#tour .tag{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--m)}
#tour h2{margin:2px 0 6px;font-size:17px;color:var(--g);font-weight:500}
#tour p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:#c3ceda}
#tour .nav{display:flex;gap:6px}#tour .nav .b{flex:1}
@media(max-width:820px),(max-width:900px) and (max-height:500px){
  #tour{bottom:calc(64px + var(--safe-b));padding:12px 14px}
  #tour p{font-size:13px;margin-bottom:8px}
}

/* Phones: compact chrome so the watch remains the visual focus. */
@media(max-width:480px),(max-width:900px) and (max-height:500px){
  #mobile-tools{right:6px;top:calc(6px + var(--safe-t));gap:3px}
  #mobile-tools .b{padding:5px 6px;font-size:6.8px;letter-spacing:.055em;border-radius:6px;line-height:1.1}

  #bar{left:4px;right:4px;bottom:calc(4px + var(--safe-b));gap:3px;padding:3px;border-radius:9px}
  #bar .b{padding:4px 5px;font-size:6.5px;letter-spacing:.035em;border-radius:5px;line-height:1.1}
  #bar .sep{margin:0 1px}

  #info{
    max-height:min(38vh,290px);max-height:min(38dvh,290px);
    padding:8px 11px calc(38px + var(--safe-b));border-radius:12px 12px 0 0;
    overscroll-behavior:contain
  }
  #info .handle{width:24px;height:3px;margin-bottom:7px}
  #info .tag{font-size:7.5px;letter-spacing:.15em}
  #info h2{font-size:13px;line-height:1.2;margin:1px 24px 4px 0}
  #info p{font-size:10.5px;line-height:1.38;margin-bottom:6px}
  #info .sp{font-size:9px;padding-top:6px}
  #info .nav{margin-top:7px;gap:4px}
  #info .nav .b{padding:4px 5px;font-size:6.5px}
  #info .x-btn{top:5px;right:5px;width:22px;height:22px;font-size:10px;border-radius:50%}

  #side{padding:6px}
  #side .grp{font-size:8px;letter-spacing:.14em;margin:8px 5px 3px}
  #side .it{font-size:10.5px;line-height:1.2;padding:5px 6px;border-radius:5px}

  #tour{
    left:4px;right:4px;bottom:calc(34px + var(--safe-b));width:auto;transform:none;
    max-height:min(29vh,210px);max-height:min(29dvh,210px);overflow:auto;
    padding:8px 10px 7px;border-radius:10px;overscroll-behavior:contain
  }
  #tour .tag{font-size:7px;letter-spacing:.15em}
  #tour h2{font-size:12px;line-height:1.2;margin:1px 0 3px}
  #tour p{font-size:10px;line-height:1.35;margin:0 0 6px}
  #tour .nav{gap:4px}
  #tour .nav .b{padding:4px 5px;font-size:6.5px;line-height:1.1}
}
</style></head><body>
<div id="app"></div>
<div id="side" class="p"></div>

<!-- Mobile floating buttons -->
<div id="mobile-tools">
  <button class="b" id="mParts">Parts</button>
</div>

<div id="backdrop"></div>

<div id="info" class="p">
  <div class="handle"></div>
  <button class="b x-btn" id="x">✕</button>
  <div class="tag" id="itag"></div><h2 id="iname"></h2><p id="itext"></p><div class="sp" id="ispec"></div>

</div>

<div id="bar" class="p">
  <button class="b" data-v="front">Front</button><button class="b" data-v="back">Back</button><button class="b" data-v="q">3/4</button><button class="b" data-v="side">Side</button><span class="sep"></span>
  <button class="b" id="bEx">Explode</button><button class="b" id="bCase">Hide case</button><button class="b" id="bSpin">Auto-rotate</button><button class="b" id="bPause">Pause</button><button class="b" id="bLapse">Time ×1</button><span class="sep"></span><button class="b" id="bTour">▶ Tour</button>
</div>
<div id="tour" class="p"><div class="tag" id="tstep"></div><h2 id="tname"></h2><p id="ttext"></p><div class="nav"><button class="b" id="tprev">‹ Back</button><button class="b" id="tnext">Next ›</button><button class="b" id="tx">Exit</button></div></div>
<div id="tip"></div>
<div id="err"></div>

<script>
window.addEventListener('error',e=>{const el=document.getElementById('err');if(!el)return;
 el.style.display='block';el.textContent='Error: '+e.message+'\n'+(e.filename||'')+':'+(e.lineno||'');});
window.addEventListener('unhandledrejection',e=>{const el=document.getElementById('err');if(!el)return;
 el.style.display='block';el.textContent='Promise rejection: '+(e.reason&&e.reason.message||e.reason);});
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const $=id=>document.getElementById(id),PI=Math.PI,V=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const IS_MOBILE=matchMedia('(max-width:820px),(max-width:900px) and (max-height:500px)').matches;
const IS_PHONE=matchMedia('(max-width:480px),(max-width:900px) and (max-height:500px)').matches;
if(IS_PHONE){
  const shortLabels={bCase:'Case',bSpin:'Spin',bLapse:'×1'};
  for(const [id,label] of Object.entries(shortLabels)){
    const b=$(id);b.setAttribute('aria-label',b.textContent);b.textContent=label;

/* ---------- renderer / scene ---------- */

renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.outputColorSpace=THREE.SRGBColorSpace;

$('app').appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);
camera.position.set(4.2,-2.6,8.6);
const controls=new OrbitControls(camera,renderer.domElement);

/* Studio environment: dark room with softbox strips -> crisp, sweeping reflections on metal */

  const pm=new THREE.PMREMGenerator(renderer),es=new THREE.Scene();
  es.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,16),new THREE.MeshBasicMaterial({color:0x08090c,side:THREE.BackSide})));
  const sb=(w,h,p,c,i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i*.3),side:THREE.DoubleSide,toneMapped:false}));m.position.set(...p);m.lookAt(0,0,0);es.add(m)};
  sb(18,7,[0,15,6],0xfff4e0,5);      // overhead softbox
  sb(2.5,18,[-15,2,5],0xffe6c4,8);   // warm left strip
  sb(2.5,18,[15,-1,4],0xcfe0ff,7);   // cool right strip
  sb(14,2.2,[0,-11,12],0xffffff,4);  // low front fill
  sb(5,5,[8,10,13],0xffffff,10);     // hot spot for glints
  sb(12,8,[0,3,-16],0xffeedd,4);     // rear softbox
  sb(3,13,[-10,-5,-12],0xcde0ff,6);sb(3,13,[10,8,-11],0xfff0dd,6);
  scene.environment=pm.fromScene(es,.035).texture;
  const bc=document.createElement('canvas');bc.width=bc.height=512;const bg=bc.getContext('2d'),gr=bg.createRadialGradient(256,190,20,256,256,370);
  gr.addColorStop(0,'#2b3541');gr.addColorStop(.55,'#10151c');gr.addColorStop(1,'#040506');bg.fillStyle=gr;bg.fillRect(0,0,512,512);
  const bt=new THREE.CanvasTexture(bc);bt.colorSpace=THREE.SRGBColorSpace;scene.background=bt;
}catch(e){console.warn('Studio environment failed',e)}
/* Bloom (glow) post-processing; falls back to plain rendering if unavailable */
let composer=null,film=null;
try{
  const [{EffectComposer},{RenderPass},{UnrealBloomPass},{OutputPass},{ShaderPass}]=await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),import('three/addons/postprocessing/OutputPass.js'),import('three/addons/postprocessing/ShaderPass.js')]);
  const pr=renderer.getPixelRatio();

  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),IS_MOBILE?.2:.28,.5,.34));
  composer.addPass(new OutputPass());
  const FilmShader={uniforms:{tDiffuse:{value:null},time:{value:0},vig:{value:.36},grain:{value:.04}},
   vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
   fragmentShader:'uniform sampler2D tDiffuse;uniform float time,vig,grain;varying vec2 vUv;float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}void main(){vec4 c=texture2D(tDiffuse,vUv);float d=length((vUv-.5)*vec2(1.,.9))*1.35;c.rgb*=1.-vig*smoothstep(.3,1.,d);float n=h(gl_FragCoord.xy+fract(time)*vec2(97.,53.))-.5;c.rgb+=n*grain;gl_FragColor=vec4(c.rgb,1.);}'};
  film=new ShaderPass(FilmShader);composer.addPass(film);
}catch(e){console.warn('Bloom unavailable, using plain rendering',e);composer=null;film=null}
const key=new THREE.DirectionalLight(0xfff1dc,.51);key.position.set(4,5,9);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0004;key.shadow.normalBias=.02;
Object.assign(key.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:30});
const rimL=new THREE.DirectionalLight(0xa9c7ff,.27);rimL.position.set(-5,-3,-9);
const fillL=new THREE.DirectionalLight(0xffffff,.15);fillL.position.set(-5,4,5);

// Dedicated illumination for the movement viewed through the exhibition back.
// These lights sit on the rear (negative-Z) side, so the reverse of the
// bridges, winding train and rotor remain readable in the Back camera view.
const rearKey=new THREE.DirectionalLight(0xffedcf,.5);
rearKey.position.set(1.5,6,-8);
rearKey.castShadow=false;
const rearFill=new THREE.DirectionalLight(0xb9d5ff,.26);
rearFill.position.set(-6,-1,-5);
rearFill.castShadow=false;
const softAmbient=new THREE.HemisphereLight(0xdce8f7,0x343b47,.13);
scene.add(key,rimL,fillL,rearKey,rearFill,softAmbient);

/* ---------- textures ---------- */
const cv=(n,f)=>{const c=document.createElement('canvas');c.width=c.height=n;f(c.getContext('2d'),n);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t};
const dialTex=cv(1024,(g,n)=>{const c=n/2,R=r=>r/2*c;
 const gr=g.createRadialGradient(c,c,R(1.55),c,c,R(2));gr.addColorStop(0,'#162845');gr.addColorStop(.55,'#2a4a78');gr.addColorStop(1,'#14233a');
 g.fillStyle=gr;g.beginPath();g.arc(c,c,R(2),0,2*PI);g.moveTo(c+R(1.55),c);g.arc(c,c,R(1.55),0,2*PI,true);g.fill('evenodd');
 for(let i=0;i<720;i++){g.save();g.translate(c,c);g.rotate(i*PI/360);g.fillStyle=i%2?'rgba(255,255,255,.045)':'rgba(0,0,0,.10)';g.fillRect(-.6,-R(1.99),1.2,R(.44));g.restore()}
 for(let i=0;i<60;i++){g.save();g.translate(c,c);g.rotate(i*PI/30);g.fillStyle='#d8cfb8';const big=i%5==0;g.fillRect(-(big?2.2:1),-R(1.97),big?4.4:2,R(big?.1:.06));g.restore()}
 g.strokeStyle='rgba(230,192,123,.7)';g.lineWidth=2;g.beginPath();g.arc(c,c,R(1.9),0,2*PI);g.stroke();
 g.fillStyle='#e9e1cc';g.textAlign='center';g.font=`600 ${R(.075)}px "Helvetica Neue",Arial,sans-serif`;
 g.fillText('MECHANICA',c,c-R(1.63));g.font=`${R(.048)}px Arial`;g.fillText('SWISS MADE',c,c+R(1.66)+8)});
const plateTex=cv(512,(g,n)=>{g.fillStyle='#262b32';g.fillRect(0,0,n,n);for(let y=0;y<n+20;y+=20)for(let x=0;x<n+20;x+=20){const ox=(y/20)%2?10:0;
 const r=g.createRadialGradient(x+ox,y,2,x+ox,y,13);r.addColorStop(0,'rgba(255,255,255,.14)');r.addColorStop(1,'rgba(0,0,0,.28)');g.fillStyle=r;g.beginPath();g.arc(x+ox,y,12,0,2*PI);g.fill()}});
const stripes=cv(256,(g,n)=>{for(let x=0;x<n;x+=16){const gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'#777');gr.addColorStop(.5,'#fff');gr.addColorStop(1,'#777');g.fillStyle=gr;g.fillRect(x,0,16,n)}});
stripes.wrapS=stripes.wrapT=THREE.RepeatWrapping;

/* ---------- materials ---------- */
const M=(c,m,r,o={})=>new THREE.MeshPhysicalMaterial({color:c,metalness:m,roughness:r,...o});
const steel=M(0xe4e9ef,1,.08),brushed=M(0xbfc7d1,1,.3),gun=M(0x3b4048,1,.3,{clearcoat:.3}),gold=M(0xd6a94f,1,.16),goldS=M(0xc9963a,1,.25),
 blue=M(0x1e4a8a,1,.12),ruby=M(0xc8213c,0,.04,{clearcoat:1,emissive:0x5a0010,emissiveIntensity:.8}),leather=M(0x17110d,0,.55,{clearcoat:.3}),
 cdg=m=>{const c=m.clone();c.map=stripes;return c},
 glass=M(0xdfeaf5,0,0,{transparent:true,opacity:.1,clearcoat:1,envMapIntensity:2.2,depthWrite:false,side:THREE.DoubleSide});

const glowG=M(0xd6a94f,1,.16,{emissive:0xd9a441,emissiveIntensity:.55}),glowS=M(0xc9963a,1,.25,{emissive:0xd9a441,emissiveIntensity:.5}),glowB=M(0x1e4a8a,1,.12,{emissive:0x3a72d8,emissiveIntensity:.45});
/* ---------- registry ---------- */
const watch=new THREE.Group();scene.add(watch);const parts={};
function reg(k,o,p,ex=V()){o.position.copy(p);o.userData.ex=ex;o.userData.p0=p.clone();
 o.traverse(m=>{if(m.isMesh){m.userData.key=k;m.castShadow=m.receiveShadow=true}});watch.add(o);(parts[k]||=[]).push(o);return o}
const cyl=(r,h,m,s=32)=>{const x=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,s),m);x.rotation.x=PI/2;return x};
const ext=(s,d,m,b=.01)=>new THREE.Mesh(new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSize:b,bevelThickness:b,bevelSegments:2,curveSegments:16}),m);
const lathe=(pts,m)=>{const g=new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),128);g.rotateX(PI/2);const x=new THREE.Mesh(g,m);m.side=THREE.DoubleSide;return x};
const slot=(r1,r2,b0,b1)=>{const h=new THREE.Path();h.absarc(0,0,r2,b0,b1,false);h.absarc(0,0,r1,b1,b0,true);h.closePath();return h};

function gear(r,n,th,mat,sp=5,hub=.07){
 const s=new THREE.Shape(),ri=r*.9,a=PI*2/n;
 for(let i=0;i<n;i++)[[0,ri],[.15,r],[.45,r],[.62,ri]].forEach(([f,q],j)=>{const t=(i+f)*a,x=Math.cos(t)*q,y=Math.sin(t)*q;i+j?s.lineTo(x,y):s.moveTo(x,y)});
 s.closePath();
 for(let i=0;i<sp;i++){const h=new THREE.Path(),b0=i/sp*2*PI+.16,b1=(i+1)/sp*2*PI-.16;h.absarc(0,0,r*.76,b0,b1,false);h.absarc(0,0,hub*2.2,b1,b0,true);h.closePath();s.holes.push(h)}
 const m=ext(s,th,mat,.006);m.position.z=-th/2;const g=new THREE.Group();g.add(m,cyl(hub,th*3,steel,16));return g}

orb.visible=false;scene.add(orb);
const flow=new THREE.Group();flow.visible=false;scene.add(flow);
const ZFl=.52,ZRl=-.66,W=(x,y,z)=>V(x,y,z);
const WP={barrel:W(-.72,.5,ZFl),center:W(0,0,ZFl),third:W(.55,.45,ZFl),fourth:W(.8,-.1,ZFl),esc:W(.62,-.5,ZFl),pal:W(.2,-.8,ZFl),bal:W(-.45,-.95,ZFl),rotor:W(0,0,ZRl),red:W(-.5,-.15,ZRl),rat:W(-.72,.5,ZRl)};
const TOUR=[
['Stored energy','front',['barrel','mainspring'],'barrel','The mainspring coiled inside the barrel is the watch’s energy store. As it slowly unwinds it turns the barrel, giving around 42 hours of power.'],
['Centre wheel','front',['centerWheel'],'center','The barrel’s teeth mesh with the centre wheel, which turns once an hour and carries the minute hand. Notice how the teeth interlock and the wheels turn in opposite directions.'],
['Third wheel','front',['thirdWheel'],'third','Energy passes on to the third wheel. Each gear step trades torque for speed, so the train speeds up as it moves away from the barrel.'],
['Fourth wheel','front',['fourthWheel'],'fourth','The fourth wheel turns once a minute and carries the seconds hand. Every wheel in the train advances in small steps, one per beat.'],
['Escape wheel','front',['escapeWheel'],'esc','The escape wheel receives that energy, but its teeth are held back and released one at a time. This stops the train from simply unwinding in a rush.'],
['Pallet fork','front',['palletFork'],'pal','Ruby pallets lock and release the escape wheel with each beat, and give the balance a small kick of energy each swing. That is the “tick”.'],
['Balance & hairspring','front',['balance','hairspring'],'bal','The balance and hairspring oscillate about four times a second. They set the pace for the whole train, and that steady rhythm is what keeps time.'],
['Rotor','rear',['rotor','bearing'],'rotor','Now round the back: movement of your wrist swings the rotor on its ball bearing. This is how an automatic watch winds itself.'],
['Winding train','rear',['reverser','reducer'],'red','The rotor drives the reversing and reduction wheels, which gear the swing down and send it to the spring in a single winding direction.'],
['Ratchet & click','rear',['ratchet','click','crownWheel'],'rat','The ratchet winds the mainspring and the click stops it slipping back. The energy is back in the barrel, and the cycle begins again.']];
const segs=TOUR.map((t,i)=>{if(!i||TOUR[i-1][1]!==t[1])return null;const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(WP[TOUR[i-1][3]],WP[t[3]]),8,.016,8,false),hotMat);m.visible=false;flow.add(m);return m});
const tour={on:false,i:0,m:[],et:0},HANDS=['hour','minute','second'];
function tourGlow(keys){
 tour.m.forEach(([m,o])=>m.material=o);tour.m=[];const set=new Set();keys.forEach(k=>meshesOf(k).forEach(m=>set.add(m)));
 set.forEach(m=>{const mats=Array.isArray(m.material)?m.material:[m.material];
  const c=mats.map(x=>{const y=x.clone();y.emissive=new THREE.Color(0xd6a94f);y.emissiveIntensity=1.5;return y});
  tour.m.push([m,m.material]);m.material=Array.isArray(m.material)?c:c[0]})}
function focusKeys(keys,side){const b=new THREE.Box3();keys.forEach(k=>parts[k].forEach(o=>b.expandByObject(o)));
 const c=b.getCenter(V()),sz=b.getSize(V()).length(),dir=(side=='rear'?V(.3,-.3,-1):V(.2,-.25,1)).normalize();
 flyTo(c.clone().addScaledVector(dir,Math.max(3.2,sz*2+1.4)),c)}
function goTour(i){
 if(i<0)return;if(i>=TOUR.length){endTour();return}
 tour.i=i;tour.et=0;const [n,side,keys,,txt]=TOUR[i];
 $('tstep').textContent='Step '+(i+1)+' of '+TOUR.length+' · '+(side=='rear'?'Rear':'Front');$('tname').textContent=n;$('ttext').textContent=txt;
 $('tnext').textContent=i==TOUR.length-1?'Finish':'Next ›';$('tprev').style.opacity=i?1:.4;
 tourGlow(keys);segs.forEach((m,j)=>{if(m)m.visible=j<=i&&TOUR[j][1]===side});focusKeys(keys,side)}
function startTour(){select(null);exT=0;const be=$('bEx');if(be)be.classList.remove('on');
 tour.on=true;flow.visible=true;orb.visible=true;HANDS.forEach(k=>parts[k].forEach(o=>o.visible=false));
 $('tour').style.display='block';$('bTour').classList.add('on');goTour(0)}
function endTour(){tour.on=false;tourGlow([]);flow.visible=false;orb.visible=false;HANDS.forEach(k=>parts[k].forEach(o=>o.visible=true));
 $('tour').style.display='none';$('bTour').classList.remove('on')}
$('bTour').onclick=()=>tour.on?endTour():startTour();
$('tnext').onclick=()=>goTour(tour.i+1);$('tprev').onclick=()=>goTour(tour.i-1);$('tx').onclick=endTour;
function tourTick(dt){
 if(!tour.on)return;tour.et+=dt;const et=tour.et,t=TOUR[tour.i],cur=WP[t[3]],prev=segs[tour.i]?WP[TOUR[tour.i-1][3]]:null;
 if(prev){const u=(et*.55)%1;orb.position.lerpVectors(prev,cur,u*u*(3-2*u))}
 else orb.position.set(cur.x+Math.cos(et*2.4)*.34,cur.y+Math.sin(et*2.4)*.34,cur.z);
 orb.scale.setScalar(1+.25*Math.sin(et*9));
 const v=1.4+.6*Math.sin(et*5);tour.m.forEach(([m])=>(Array.isArray(m.material)?m.material:[m.material]).forEach(x=>x.emissiveIntensity=v))}

/* ---------- true meshing: initial tooth phase so neighbouring gears interlock ---------- */
const frac=x=>x-Math.floor(x);
function meshAngle(thA,pa,NA,pb,NB){const al=Math.atan2(pb.y-pa.y,pb.x-pa.x),dA=frac((al-thA)*NA/(2*PI)-.31),dB=frac(.5-dA);return al+PI-(dB+.31)*2*PI/NB}
const O=V(),TH={};
TH.b=0;TH.c=meshAngle(TH.b,barrel.position,62,cw.position,48);TH.t=meshAngle(TH.c,cw.position,48,tw.position,40);TH.f=meshAngle(TH.t,tw.position,40,fw.position,32);
TH.v1=meshAngle(0,O,30,rv1.position,32);TH.v2=meshAngle(0,O,30,rv2.position,32);TH.red=meshAngle(0,O,30,red.position,36);
TH.rat=meshAngle(TH.red,red.position,36,rat.position,50);TH.crw=meshAngle(TH.rat,rat.position,50,crw.position,36);
const stp=(v,rate)=>{const f=v*rate,n=Math.floor(f),u=Math.min(1,(f-n)/.18);return (n+u*u*(3-2*u))/rate};

/* ---------- animation ---------- */
const clock=new THREE.Clock();let tm=0;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.1);
 if(!paused){tm+=dt;hs+=dt*lapse}
 ex+=(exT-ex)*Math.min(1,dt*4);
 for(const k in parts)parts[k].forEach(o=>{if(o.userData.p0)o.position.copy(o.userData.p0).addScaledVector(o.userData.ex,ex)});
 // escapement: one beat = half balance oscillation; everything steps on the beat
 const bt=tm*4,fl=Math.floor(bt),uu=Math.min(1,(bt-fl)/.22),S=fl+uu*uu*(3-2*uu);
 bal.rotation.z=1.5*Math.sin(PI*bt);pal.rotation.z=.13*Math.tanh(8*Math.sin(PI*bt));ew.rotation.z=S*PI/15;
 // going train: Δθ_B = -(N_A/N_B)·Δθ_A keeps every tooth pair interlocked
 const df=-S*.07,dT=-(32/40)*df,dC=-(40/48)*dT,dB=-(48/62)*dC;
 fw.rotation.z=TH.f+df;tw.rotation.z=TH.t+dT;cw.rotation.z=TH.c+dC;barrel.rotation.z=TH.b+dB;
 // automatic winding train (always one-way: rotor angle is monotonic)
 const ra=tm*.45+.35*Math.sin(tm*1.1);rotG.rotation.z=ra;
 rv1.rotation.z=TH.v1-(30/32)*ra;rv2.rotation.z=TH.v2-(30/32)*ra;
 const dR=-(30/36)*ra,dRt=-(36/50)*dR;red.rotation.z=TH.red+dR;rat.rotation.z=TH.rat+dRt;crw.rotation.z=TH.crw-(50/36)*dRt;
 // hands move in real 8-beat-per-second steps
 const hq=stp(hs,8);hS.rotation.z=-(hq%60)/60*2*PI;hM.rotation.z=-(hq%3600)/3600*2*PI;hH.rotation.z=-(hq%43200)/43200*2*PI;
 if(fly){fly.s+=dt/1.1;const k=fly.s>=1?1:1-Math.pow(1-fly.s,3);camera.position.lerpVectors(fly.p0,fly.p1,k);controls.target.lerpVectors(fly.t0,fly.t1,k);if(fly.s>=1)fly=null}
 {const g=performance.now()*.001;glowG.emissiveIntensity=.55+.12*Math.sin(g*1.6);glowS.emissiveIntensity=.5+.1*Math.sin(g*1.6);glowB.emissiveIntensity=.45+.1*Math.sin(g*1.6+1)}
 if(film)film.uniforms.time.value=performance.now()*.001;
 hl();tourTick(dt);controls.update();composer?composer.render():renderer.render(scene,camera)})();
</script></body></html>
